spring.application.name=RoadMapService
server.port=8086

# ---------------------------------------------------------------------------
# Database Configuration (H2 Default for Instant Running / MySQL 8 Ready)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging, accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---------------------------------------------------------------------------
# MySQL 8 Configuration (SRS DB-1: database-per-service on MySQL 8)
# To use MySQL: Set SPRING_PROFILES_ACTIVE=mysql or configure the properties below:
# spring.datasource.url=jdbc:mysql://localhost:3306/analytics_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Kafka Configuration (SRS Table 3-4: Message Broker)
# Auto-startup is set to false by default for standalone testing without broker
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-roadmap-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}
spring.kafka.producer.properties.max.block.ms=1000
kafka.dispatch.enabled=${KAFKA_DISPATCH_ENABLED:false}

# ---------------------------------------------------------------------------
# External Inter-Service Endpoints (SRS Figure B-6)
# ---------------------------------------------------------------------------
services.resume.url=${RESUME_SERVICE_URL:http://localhost:8083}
services.interview.url=${INTERVIEW_SERVICE_URL:http://localhost:8082}
services.coding.url=${CODING_SERVICE_URL:http://localhost:8084}
services.aptitude.url=${APTITUDE_SERVICE_URL:http://localhost:8085}

# ---------------------------------------------------------------------------
# Groq / OpenAI Compatible AI Configuration
# Set API_KEY in environment variable
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=4096

# Logging
logging.level.com.RoadMapService=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.kafka=WARN
