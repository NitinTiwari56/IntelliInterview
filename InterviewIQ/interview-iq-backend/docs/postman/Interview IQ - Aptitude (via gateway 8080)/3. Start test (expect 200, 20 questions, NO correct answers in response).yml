info:
  name: 3. Start test (expect 200, 20 questions, NO correct answers in response)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/aptitude/tests"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setCollectionVar('testId', res.getBody().testId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
