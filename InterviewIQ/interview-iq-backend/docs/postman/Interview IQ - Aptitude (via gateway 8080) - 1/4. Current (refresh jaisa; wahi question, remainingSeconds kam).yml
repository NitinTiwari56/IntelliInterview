info:
  name: 4. Current (refresh jaisa; wahi question, remainingSeconds kam)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/aptitude/tests/current"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "var r = res.getBody();\r

        if (r.testId) bru.setCollectionVar('testId', r.testId);\r

        bru.setCollectionVar('qIndex', r.question ? r.question.index : '');"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
