info:
  name: 6. ANSWER current question (selectedIndex 0). Isko 20 baar chalao (Runner/repeat) -> end mein COMPLETED + result
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/aptitude/tests/{{testId}}/answer"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "questionIndex": {{qIndex}},
        "selectedIndex": 0
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "var r = res.getBody();\r

        if (r.testId) bru.setCollectionVar('testId', r.testId);\r

        bru.setCollectionVar('qIndex', r.question ? r.question.index : '');"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
