info:
  name: 5. ANALYZE with a .txt/.docx file (expect 400 Unsupported file format)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/resume/analyze"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
      - name: targetRole
        type: text
        value: Backend Engineer
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
