info:
  name: 10. Galat interviewType (expect 400)
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/interview/sessions/start"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "interviewType": "FOO"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
