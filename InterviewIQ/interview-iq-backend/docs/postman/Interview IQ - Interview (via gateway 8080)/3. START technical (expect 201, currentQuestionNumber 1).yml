info:
  name: 3. START technical (expect 201, currentQuestionNumber 1)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/interview/sessions/start"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "interviewType": "TECHNICAL",
        "inputMode": "TEXT",
        "targetRole": "Backend Engineer",
        "maxQuestions": 3
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setCollectionVar('sessionId', res.getBody().sessionId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
