info:
  name: 9. END early (expect status INCOMPLETE)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/interview/sessions/{{sessionId}}/end"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
