spring.application.name=resume-service
server.port=8082

# ---------------------------------------------------------------------------
# File upload (REQ-RES-2: sirf PDF, max 2 MB)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true
# Resume PDFs yahan save hoti hain (personal data: git mein kabhi commit mat karo, .gitignore mein uploads/ hai)
file.upload-dir=${RESUME_UPLOAD_DIR:uploads/resumes}

# ---------------------------------------------------------------------------
# MySQL 8 (database-per-service). Password apna daalo, ya env var DB_PASSWORD set karo.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Groq (OpenAI-compatible). Key nahi hai toh rule-based ATS analyzer chalta hai.
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=8096

logging.level.com.interviewiq.resume=INFO
logging.level.org.springframework.ai=WARN
