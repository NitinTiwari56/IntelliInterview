spring.application.name=analytics-service
server.port=8086

# ---------------------------------------------------------------------------
# MySQL 8 (database-per-service). Password apna daalo, ya env var DB_PASSWORD set karo.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/analytics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Kafka: hum use nahi karte (services REST se data deti hain). Listener band hai, toh broker ke bina bhi chalta hai.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-roadmap-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}
spring.kafka.producer.properties.max.block.ms=1000
kafka.dispatch.enabled=${KAFKA_DISPATCH_ENABLED:false}

# ---------------------------------------------------------------------------
# Doosri services (internal endpoints /internal/**)
# ---------------------------------------------------------------------------
services.resume.url=${RESUME_SERVICE_URL:http://localhost:8082}
services.interview.url=${INTERVIEW_SERVICE_URL:http://localhost:8085}
services.coding.url=${CODING_SERVICE_URL:http://localhost:8083}
services.aptitude.url=${APTITUDE_SERVICE_URL:http://localhost:8084}

# Cached roadmap itne minute baad apne aap refresh (Kafka events nahi hain)
analytics.roadmap.max-age-minutes=30

# ---------------------------------------------------------------------------
# Groq (OpenAI-compatible). Key nahi hai toh rule-based roadmap engine chalta hai.
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=4096

logging.level.com.interviewiq.analytics=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.kafka=WARN
