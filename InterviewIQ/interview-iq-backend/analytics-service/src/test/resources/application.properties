# Sirf tests ke liye: in-memory H2. (Is file ke hote main application.properties load nahi hoti.)
spring.application.name=analytics-service
spring.datasource.url=jdbc:h2:mem:analyticstestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=analytics-roadmap-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=false
spring.kafka.producer.properties.max.block.ms=1000
kafka.dispatch.enabled=false

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=dummy-test-key
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

analytics.roadmap.max-age-minutes=30
