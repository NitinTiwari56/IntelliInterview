spring.application.name=interview-service
server.port=8085

# ---------------------------------------------------------------------------
# MySQL 8 (database-per-service). Password apna daalo, ya env var DB_PASSWORD set karo.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Groq (OpenAI-compatible). Key nahi hai toh rule-based interview engine chalta hai.
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.max-tokens=4096

# Resume service (student ka latest resume interview questions ke liye)
services.resume.url=${RESUME_SERVICE_URL:http://localhost:8082}

interview.session.timeout-minutes=15
interview.default.max-questions=5

logging.level.com.interviewiq.interview=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.web.socket=INFO
