# Sirf tests ke liye: in-memory H2. (Is file ke hote main application.properties load nahi hoti.)
spring.application.name=interview-service
spring.datasource.url=jdbc:h2:mem:interviewtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=dummy-test-key
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

services.resume.url=http://localhost:1
interview.session.timeout-minutes=15
interview.default.max-questions=5
