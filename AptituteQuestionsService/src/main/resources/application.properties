spring.application.name=AptituteQuestionsService
server.port=8082

# Groq API configuration (OpenAI-compatible endpoint)
# Set GROQ_API_KEY (or OPENAI_API_KEY) in environment or replace dummy-key below with your real key
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4096
