spring.application.name=InterviewService
server.port=8082

# ---------------------------------------------------------------------------
# Database Configuration (H2 Default for Instant Running / MySQL 8 Ready)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging, accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---------------------------------------------------------------------------
# MySQL 8 Configuration (SRS DB-1: database-per-service on MySQL 8)
# To use MySQL: Set SPRING_PROFILES_ACTIVE=mysql or configure the properties below:
# spring.datasource.url=jdbc:mysql://localhost:3306/interview_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Groq / OpenAI Compatible AI Configuration
# Set API_KEY or GROQ_API_KEY / OPENAI_API_KEY in environment
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${API_KEY}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.max-tokens=4096

# ---------------------------------------------------------------------------
# Interview Service Custom Settings
# ---------------------------------------------------------------------------
interview.session.timeout-minutes=15
interview.default.max-questions=5

# Logging
logging.level.com.InterviewPrep=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.web.socket=INFO
